<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Project | ProofSpace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 40px auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #432078;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #432078;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #7541b8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #54268e;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7541b8;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Create New Project</h1>

        <p>Enter your project details below.</p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Project
            </button>

        </form>

        <a href="{% url 'dashboard' %}">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
