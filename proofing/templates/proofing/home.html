<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofSpace | Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #263252;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            background: white;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #4055b5;
        }

        nav a {
            text-decoration: none;
            margin-left: 20px;
            color: #333;
            font-weight: bold;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #3346a8;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            max-width: 650px;
            color: #60677b;
            margin-bottom: 30px;
        }

        .buttons a {
            display: inline-block;
            padding: 13px 30px;
            margin: 8px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .login {
            background: #4055b5;
            color: white;
        }

        .register {
            background: white;
            color: #4055b5;
            border: 2px solid #4055b5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ProofSpace</div>

        <nav>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to ProofSpace</h1>

        <p>
            Your smart client proofing and file approval portal.
            Manage projects, upload files, review deliverables,
            and collect client feedback — all in one place.
        </p>

        <div class="buttons">
            <a href="{% url 'login' %}" class="login">Login</a>
            <a href="{% url 'register' %}" class="register">Get Started</a>
        </div>
    </section>

    <footer>
        © 2026 ProofSpace. All Rights Reserved.
    </footer>

</body>
</html>
