<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ProofSpace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: 50px auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #432078;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #7541b8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #54268e;
        }

        a {
            color: #7541b8;
            text-decoration: none;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Create Your ProofSpace Account</h1>

        <p>Join ProofSpace to manage projects and approvals.</p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Create Account</button>

        </form>

        <div class="links">

            <p>Already have an account?</p>

            <a href="{% url 'login' %}">Login Here</a>

            <br><br>

            <a href="{% url 'home' %}">Back to Home</a>

        </div>

    </div>

</body>
</html>
